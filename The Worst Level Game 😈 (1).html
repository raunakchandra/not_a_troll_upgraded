<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Worst Level Game 😈</title>
<style>
:root{--bg:#0f0f1a;--fg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f1a;--fg:#fff}}
:root[data-theme="dark"]{--bg:#0f0f1a;--fg:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none}
canvas{width:min(100vw,calc((100dvh - 120px)*16/9));aspect-ratio:16/9;background:#1b1b2f;touch-action:none;display:block}
#ctl{display:flex;gap:10px;width:min(100vw,720px);padding:10px;box-sizing:border-box}
button{flex:1;height:68px;font-size:26px;border-radius:14px;border:0;background:#2d2d4d;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
button.j{flex:2;background:#e63946}
</style></head><body>
<canvas id="c"></canvas>
<div id="ctl"><button data-k="l">◀</button><button data-k="r">▶</button><button data-k="j" class="j">JUMP</button></div>
<script>
const NAME="ADARSH";
const W=800,H=450,C=document.getElementById('c'),X=C.getContext('2d');C.width=W;C.height=H;
let L=0,deaths=0,P,lv,over=0,rev=0,fw=1,msg='',msgT=0,shake=0,state='menu',ft=0,conf=[];
const keys={l:0,r:0,j:0};
const G=(a,b)=>({x:a,y:400,w:b-a,h:50}),Ce=(a,b)=>({x:a,y:0,w:b-a,h:50});
const S=(x,o={})=>({x,y:380,w:30,h:20,...o}),D=(x,o={})=>({x,y:355,w:30,h:45,...o});
const m=(t,n=120)=>{msg=t;msgT=n};
const taunts=["Skill issue 💀","Try again, champion","You jumped early, didn't you?","Bro really thought that was safe 😭","Your death counter is nervous","Easy level, they said 😈","Even a Creeper plays smarter 💥","Techno Gamerz would've cleared this 😭","Steve is laughing at you ⛏️"];
const LV=[
()=>({n:"Level 1: Easy 😇",p:[G(0,800)],s:[S(360)],d:D(730),t:[]}),
()=>({n:"Level 2: Remember Level 1?",p:[G(0,800)],s:[S(280)],d:D(730),dm:"Same trap. Different trap. 😈",
 t:[{c:p=>p.x>330,f:l=>l.s.push(S(420))},{c:p=>p.x>470,f:l=>l.p=[G(0,540),G(620,800)]}]}),
()=>({n:"Level 3: Follow the sign",p:[G(0,800)],s:[],d:D(730),sg:{x:520,t:"SAFE →"},dm:"The door isn't where it was 🚪",
 t:[{c:p=>p.x>640,f:l=>{l.d.x=30;m("The door got shy 🙈")}},{c:(p,l)=>l.d.x==30&&p.x<400,f:l=>{l.s.push(S(220),S(110))}}]}),
()=>({n:"Level 4: Find the exit",p:[G(0,800)],s:[S(430,{vis:false})],d:D(745,{vis:false}),k:D(620),sg:{x:540,t:"EXIT →"},dm:"The real door was invisible 🙈",t:[]}),
()=>({n:"Level 5: Jump = chaos",p:[G(0,800)],s:[S(250),S(430),S(600)],d:D(730),rj:1,dm:"Left is right. Right is left. 🙃",t:[]}),
()=>({n:"Level 6: Gravity is optional",p:[G(0,800),Ce(0,800)],s:[S(520,{y:50,dn:1}),S(700,{w:40})],d:D(760),dm:"Up is down. Down is spikes. 💀",
 t:[{c:p=>p.x>350,f:()=>{P.g=-1;m("Gravity: optional 🙃")}},{c:p=>p.x>640&&P.g<0,f:()=>{P.g=1}}]}),
()=>({n:"Level 7: Loading...",p:[G(0,800)],s:[],d:D(730),pb:1,dm:"Loading screens mean WAIT 😌",
 t:[{c:p=>p.x>300,f:l=>{over=160;l.p=[G(0,390),G(490,800)]}}]}),
()=>({n:"Level 8: Trust your brain 🧠",p:[G(0,260),G(700,800),{x:320,y:330,w:70,h:20,vis:false},{x:450,y:300,w:70,h:20,vis:false},{x:580,y:330,w:70,h:20,vis:false}],fp:[{x:300,y:360,w:60,h:12},{x:430,y:350,w:60,h:12},{x:560,y:360,w:60,h:12}],s:[],d:D(740),sg:{x:130,t:"Use your brain 🧠"},dm:"Minecraft rule: if it looks safe, it's a trap 🧠",t:[]}),
()=>({n:"Level 9: Aw man 💥",p:[G(0,560),G(650,800),{x:380,y:300,w:30,h:100}],s:[S(450,{vis:false})],d:D(745),sg:{x:300,t:"💥 creeper?"},dm:"Aw man... 💥",t:[{c:p=>p.x>600,f:l=>l.s.push(S(680))}]}),
()=>({n:"FINAL LEVEL 10 🏁 (long one)",ww:2800,p:[G(0,640),G(740,1900),G(2250,2800),Ce(1000,1560),{x:1950,y:330,w:70,h:20,vis:false},{x:2060,y:300,w:70,h:20,vis:false},{x:2170,y:330,w:70,h:20,vis:false}],fp:[{x:1930,y:360,w:60,h:12},{x:2040,y:350,w:60,h:12},{x:2150,y:360,w:60,h:12}],s:[S(260),S(400,{vis:false}),S(520),S(1250,{y:50,dn:1}),S(1400,{y:50,dn:1}),S(2560),S(2650,{vis:false})],d:D(2760),k:D(2450),sg:{x:340,t:"SAFE →"},pb:1,dm:"Checkpoint? What checkpoint 😂",
 t:[{c:p=>p.x>600,f:l=>l.s.push(S(800))},{c:p=>p.x>900,f:()=>m("Checkpoint saved ✅")},{c:p=>p.x>1100,f:()=>{P.g=-1;m("Gravity: optional 🙃")}},{c:p=>p.x>1550&&P.g<0,f:l=>{P.g=1;l.s.push(S(1640,{w:60}))}},{c:p=>p.x>2300,f:()=>{rev=1;m("Controls: reversed 😈")}}]})
];
function load(i){L=i;lv=LV[i]();P={x:40,y:370,w:24,h:30,vx:0,vy:0,g:1,og:0};rev=0;over=0}
function die(t){deaths+=Math.random()<.25?3:1;shake=12;
 const k=t||(deaths>9&&Math.random()<.3?`Level ${L+1} again? Bhai it's level ${L+1}...`:(lv.dm&&Math.random()<.6?lv.dm:taunts[Math.random()*taunts.length|0]));
 load(L);m(k)}
function win(){if(L==LV.length-1){state='fail';ft=0;return}const n=L+1;load(n);m(`Level ${n} cleared! It gets worse 😈`,100)}
const hit=(a,b,i=0)=>a.x+i<b.x+b.w&&a.x+a.w-i>b.x&&a.y+i<b.y+b.h&&a.y+a.h-i>b.y;
function step(){
 if(over>0)over--;
 P.vx=(keys.r-keys.l)*(rev?-1:1)*3.2;
 if(keys.j&&P.og){P.vy=-11.5*P.g;P.og=0;if(lv.rj)rev=1}
 P.vy=Math.max(-14,Math.min(14,P.vy+.55*P.g));
 P.x=Math.max(0,Math.min((lv.ww||W)-P.w,P.x+P.vx));
 for(const p of lv.p)if(hit(P,p))P.x=P.vx>0?p.x-P.w:p.x+p.w;
 P.y+=P.vy;P.og=0;
 for(const p of lv.p)if(hit(P,p)){if(P.vy>0){P.y=p.y-P.h;if(P.g>0)P.og=1}else{P.y=p.y+p.h;if(P.g<0)P.og=1}P.vy=0}
 for(const t of lv.t)if(!t.d&&t.c(P,lv)){t.d=1;t.f(lv)}
 for(const s of lv.s)if(hit(P,s,4))return die();
 if(lv.k&&hit(P,lv.k))return die("FAKE DOOR 😂");
 if(lv.d.on!==0&&hit(P,lv.d)){if(L==LV.length-1&&fw){fw=0;lv.d.on=0;lv.p=lv.p.map(p=>p.y==400&&p.x+p.w>=lv.d.x?{...p,w:lv.d.x-40-p.x}:p);m("LEVEL COMPLETE! 🎉",150)}else win();return}
 if(P.y>H+40||P.y<-80)die();
}
const T=(t,x,y,s=20,c='#fff',a='left')=>{X.font=`bold ${s}px sans-serif`;X.fillStyle=c;X.textAlign=a;X.fillText(t,x,y)};
const door=d=>{X.fillStyle='#e0b020';X.fillRect(d.x,d.y,d.w,d.h);T("EXIT",d.x+d.w/2,d.y+27,10,'#000','center')};
function draw(){
 X.setTransform(1,0,0,1,0,0);X.fillStyle=state=='fail'?'#7a0010':state=='bday'?'#2a1a5e':'#1b1b2f';X.fillRect(0,0,W,H);
 if(shake>0){X.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake--}
 if(state=='menu'){T("😈 THE WORST LEVEL GAME 😈",W/2,170,36,'#fff','center');T("for "+NAME+"'s 8th birthday",W/2,215,22,'#ffd166','center');T("Tap or press any key to start",W/2,290,22,'#aaa','center');T("(yes, it cheats. no, it's not fair)",W/2,325,16,'#888','center');return}
 if(state=='fail'){T("GAME OVER",W/2,200,54,'#fff','center');T("You failed all 10 levels. 💀",W/2,250,24,'#fff','center');return}
 if(state=='bday'){
  for(let i=0;i<3;i++)conf.push({x:Math.random()*W,y:-10,v:1+Math.random()*3,c:`hsl(${Math.random()*360},90%,60%)`});
  conf=conf.filter(c=>(c.y+=c.v)<H);for(const c of conf){X.fillStyle=c.c;X.fillRect(c.x,c.y,8,8)}
  T("🎉 HAPPY BIRTHDAY, "+NAME+"! 🎉",W/2,170,38,'#fff','center');T("You're 8 now! 🎂",W/2,225,28,'#ffd166','center');
  T("Total deaths: "+deaths+" (the game counted extra 😈)",W/2,275,18,'#ccc','center');T("May your Minecraft worlds never have creepers ⛏️",W/2,315,18,'#9be564','center');T("Tap to play again",W/2,350,16,'#888','center');return}
 const ww=lv.ww||W,cam=Math.max(0,Math.min(ww-W,P.x-W/2));X.save();X.translate(-cam,0);X.fillStyle='#3b7a57';for(const p of lv.p)if(p.vis!==false)X.fillRect(p.x,p.y,p.w,p.h);for(const p of lv.fp||[])X.fillRect(p.x,p.y,p.w,p.h);
 if(lv.sg)T(lv.sg.t,lv.sg.x,380,20,'#ffd166','center');
 X.fillStyle='#ff4d4d';
 for(const s of lv.s)if(s.vis!==false){X.beginPath();for(let x=s.x;x<s.x+s.w;x+=15){if(s.dn){X.moveTo(x,s.y);X.lineTo(x+7.5,s.y+s.h);X.lineTo(x+15,s.y)}else{X.moveTo(x,s.y+s.h);X.lineTo(x+7.5,s.y);X.lineTo(x+15,s.y+s.h)}}X.fill()}
 if(lv.d.vis!==false&&lv.d.on!==0)door(lv.d);if(lv.k)door(lv.k);
 X.fillStyle='#4cc9f0';X.fillRect(P.x,P.y,P.w,P.h);X.fillStyle='#fff';const ey=P.g>0?P.y+8:P.y+18;X.fillRect(P.x+5,ey,5,5);X.fillRect(P.x+14,ey,5,5);
 X.restore();T(lv.n,12,26,18);T("💀 "+deaths,W-12,26,18,'#fff','right');
 if(lv.pb){X.fillStyle='#444';X.fillRect(W-52,36,40,36);T("⏸",W-32,62,22,'#fff','center')}
 if(msgT>0){msgT--;T(msg,W/2,H/2-60,24,'#ffd166','center')}
 if(over>0){X.fillStyle='#000';X.fillRect(0,0,W,H);T("Loading... 99%",W/2,H/2,28,'#fff','center');T("please don't touch anything",W/2,H/2+34,16,'#888','center')}
}
document.querySelectorAll('button').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1;if(state=='menu'||state=='bday')start()});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=0))});
function start(){if(state=='bday'){deaths=0;fw=1}state='play';load(0)}
C.addEventListener('pointerdown',e=>{const r=C.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
 if(state=='menu'||state=='bday')start();else if(state=='play'&&lv.pb&&over<=0&&x>W-52&&x<W-12&&y>36&&y<72)die("Pause is a trap 🙃")});
const km={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'j',w:'j',' ':'j'};
addEventListener('keydown',e=>{if(state=='menu'||state=='bday')start();const k=km[e.key];if(k){keys[k]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const k=km[e.key];if(k)keys[k]=0});
let last=0,acc=0;
function loop(t){acc+=Math.min(100,t-last);last=t;
 while(acc>=16.67){acc-=16.67;if(state=='play')step();else if(state=='fail'&&++ft>170)state='bday'}
 draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
